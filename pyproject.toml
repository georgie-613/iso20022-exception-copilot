[project]
name = "iso20022-exception-copilot"
version = "0.1.0"
description = "ISO 20022 MCP server + Exception Copilot. Synthetic data only."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "lxml>=5.2",
    "mcp>=2.3,<3",
]

[project.scripts]
iso20022-mcp = "iso20022_mcp.server:main"

[project.optional-dependencies]
ui = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.115", "python-multipart>=0.0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gen", "iso20022_mcp", "copilot", "evals", "ui"]
