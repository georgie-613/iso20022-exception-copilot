name: live-eval

# Manual only. Calls the Anthropic API with the repo secret ANTHROPIC_API_KEY,
# runs rules vs model on the held-out set and the golden set, and publishes the
# comparison to the job summary and as an artifact. Regular CI never calls the API.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Claude model ID"
        default: "claude-sonnet-5-5"
        required: true

permissions:
  contents: read
  issues: write   # results are posted to an issue so they can be read without log access

jobs:
  live-eval:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      COPILOT_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the key is configured
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add ANTHROPIC_API_KEY under Settings > Secrets and variables > Actions"; exit 1
          fi
      - run: pip install -e ".[llm]"
      - name: Build case sets
        run: |
          python -m gen.build --seed 42 --out cases
          python -m gen.holdout --seed 42 --out cases_holdout
      - name: Held-out before/after
        id: holdout
        continue-on-error: true
        run: python -m evals.compare --cases cases_holdout --set holdout --out evals/results
      - name: Golden set before/after (regression check)
        id: golden
        continue-on-error: true
        run: python -m evals.compare --cases cases --set eval --out evals/results
      - name: Publish
        if: always()
        run: cat evals/results/*_comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post results to an issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} · model: \`$COPILOT_MODEL\` · commit: ${{ github.sha }}"
            echo
            cat evals/results/*_comparison.md 2>/dev/null || echo "No results written; see the run log."
          } > issue.md
          gh label create live-eval --color 5b3db5 --description "Live eval results" --force
          gh issue create --title "live-eval run ${{ github.run_id }}" --label live-eval --body-file issue.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-eval-results
          path: evals/results/
      - name: Fail if a hard gate broke
        if: steps.holdout.outcome == 'failure' || steps.golden.outcome == 'failure'
        run: exit 1
