name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Generate case set
        run: python -m gen.build --seed 42 --out cases
      - name: Eval gate (false repairs = 0, zero-miss = 0)
        run: python -m evals.run --cases cases --out evals/report
      - name: Eval report to job summary
        if: always()
        run: cat evals/report/report.md >> "$GITHUB_STEP_SUMMARY" || true
