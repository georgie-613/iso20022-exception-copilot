name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Generate case set
        run: python -m gen.build --seed 42 --out cases
      - name: Eval gate (false repairs = 0, zero-miss = 0)
        run: python -m evals.run --cases cases --out evals/report
      - name: Eval report to job summary
        if: always()
        run: cat evals/report/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Held-out set (report only; tracks known gaps)
        run: |
          python -m gen.holdout --seed 42 --out cases_holdout
          python -m evals.run --cases cases_holdout --set holdout --report-only --out evals/report-holdout
          cat evals/report-holdout/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Address structuring gate (unsafe = 0)
        run: |
          python -m gen.addresses --seed 42 --out cases_address
          python -m evals.address --cases cases_address --set address --out evals/report-address
          cat evals/report-address/address_address.md >> "$GITHUB_STEP_SUMMARY"
      - name: Address held-out (report only)
        run: |
          python -m gen.addresses --seed 42 --out cases_address_holdout --holdout
          python -m evals.address --cases cases_address_holdout --set address-holdout --report-only --out evals/report-address
          cat evals/report-address/address-holdout_address.md >> "$GITHUB_STEP_SUMMARY"
